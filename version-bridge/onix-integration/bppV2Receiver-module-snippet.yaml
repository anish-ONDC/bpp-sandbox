# Reference only — module added to the real beckn-onix adapter.yaml for the
# inbound-direction phase, not a standalone runnable file. Paths shown
# relative to the beckn-onix config directory.
#
# Inbound direction: a real v2.0.0 request coming in, upgraded to v3.0.0
# before it reaches the backend. Validates against the real, unmodified
# v2.0.0 spec (no beckn3.yaml override — the incoming payload genuinely is
# v2.0.0), then routes through bridge.js's server to upgrade it. Kept
# separate from bppTxnReciever, which still receives plain v2.0.0 traffic
# untouched.

- name: bppV2Receiver
  path: /bpp/v2-receiver/
  handler:
    type: std
    role: bpp
    subscriberId: bpp1
    httpClientConfig:
      maxIdleConns: 1000
      maxIdleConnsPerHost: 200
      idleConnTimeout: 300s
      responseHeaderTimeout: 5s
    plugins:
      cache:
        id: cache
        config:
          addr: localhost:6379
      schemaValidator:
        id: schemav2validator
        config:
          cacheTTL: "3600"
          extendedSchema_enabled: "false"
      router:
        id: router
        config:
          routingConfig: config/onix-bpp/bppV2Receiver-routing.yaml
      middleware:
        - id: reqpreprocessor
          config:
            contextKeys: transaction_id,message_id
            role: bpp
    steps:
      - validateSchema
      - addRoute
