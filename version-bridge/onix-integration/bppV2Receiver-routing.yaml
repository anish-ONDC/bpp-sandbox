# version: "2.0.0" is the one literal value ONIX's router treats domain as
# optional for, so no domain field needed here (unlike bppV3Validator-routing.yaml).
#
# All six actions now have real v2.0.0-to-v3.0.0 request artifacts, so they
# all route through the bridge instead of some going straight to the backend.
routingRules:
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/discover?target=nfh.global/subscribers.beckn.one/seller-side-bpp"
      excludeAction: true
    endpoints:
      - discover
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/select?target=nfh.global/subscribers.beckn.one/seller-side-bpp"
      excludeAction: true
    endpoints:
      - select
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/init?target=nfh.global/subscribers.beckn.one/seller-side-bpp"
      excludeAction: true
    endpoints:
      - init
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/confirm?target=nfh.global/subscribers.beckn.one/seller-side-bpp"
      excludeAction: true
    endpoints:
      - confirm
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/status?target=nfh.global/subscribers.beckn.one/seller-side-bpp"
      excludeAction: true
    endpoints:
      - status
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/cancel?target=nfh.global/subscribers.beckn.one/seller-side-bpp"
      excludeAction: true
    endpoints:
      - cancel
