# excludeAction: true + explicit full URLs, not auto-append — the target URL
# has its own query string (target= for the bridge server), and ONIX's
# auto-append is a plain string concat that would land the action name after
# the query string instead of before it. Confirmed by testing. forward= is
# no longer needed here — the bridge looks up the target's endpointUrl from
# its registry manifest instead of it being hardcoded in this routing rule.
#
# All six on_<action> callbacks now have real v3.0.0-to-v2.0.0 response
# artifacts, so they all route through the bridge.
routingRules:
  - domain: "beckn.one:logistics:p2p-delivery:1.0"
    version: "3.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/on_discover?target=nfh.global/subscribers.beckn.one/example-bap"
      excludeAction: true
    endpoints:
      - on_discover
  - domain: "beckn.one:logistics:p2p-delivery:1.0"
    version: "3.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/on_select?target=nfh.global/subscribers.beckn.one/example-bap"
      excludeAction: true
    endpoints:
      - on_select
  - domain: "beckn.one:logistics:p2p-delivery:1.0"
    version: "3.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/on_init?target=nfh.global/subscribers.beckn.one/example-bap"
      excludeAction: true
    endpoints:
      - on_init
  - domain: "beckn.one:logistics:p2p-delivery:1.0"
    version: "3.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/on_confirm?target=nfh.global/subscribers.beckn.one/example-bap"
      excludeAction: true
    endpoints:
      - on_confirm
  - domain: "beckn.one:logistics:p2p-delivery:1.0"
    version: "3.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/on_status?target=nfh.global/subscribers.beckn.one/example-bap"
      excludeAction: true
    endpoints:
      - on_status
  - domain: "beckn.one:logistics:p2p-delivery:1.0"
    version: "3.0.0"
    targetType: "url"
    target:
      url: "http://localhost:9200/translate/on_cancel?target=nfh.global/subscribers.beckn.one/example-bap"
      excludeAction: true
    endpoints:
      - on_cancel
